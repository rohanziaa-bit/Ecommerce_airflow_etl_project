name: E-commerce Airflow CD

on:
  workflow_run:
    workflows: ["E-commerce Airflow CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          INSTANCE_ID="i-035ae5478f913ff6e"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy E-commerce Airflow from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/Ecommerce_airflow_etl_project && git fetch origin main && git reset --hard origin/main && cd ecommerce-project && export PATH=/home/ubuntu/.local/bin:\$PATH && astro dev stop || true\"",
              "sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/Ecommerce_airflow_etl_project/ecommerce-project && export PATH=/home/ubuntu/.local/bin:\$PATH && astro dev start\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            echo "Deployment status: ${STATUS:-Pending}"
            case "$STATUS" in
              Success) 
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for EC2 deployment."
          exit 1
