name: E-commerce Airflow CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Validate Airflow Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E-commerce Airflow image
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-project
          file: ./ecommerce-project/Dockerfile
          push: false
          tags: ecommerce-airflow:ci
